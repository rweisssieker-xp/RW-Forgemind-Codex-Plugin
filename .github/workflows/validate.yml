name: Validate ForgeMind

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci

  release-package:
    name: Build verified release artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: forgemind-packages
          if-no-files-found: error
          include-hidden-files: true
          path: |
            dist/plugin
            dist/marketplace

  publish-release:
    name: Publish verified release evidence
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forgemind-packages
          path: dist
      - name: Create distributable release archives
        run: |
          tar -C dist -czf "dist/forgemind-plugin-${GITHUB_REF_NAME}.tar.gz" plugin
          tar -C dist -czf "dist/forgemind-marketplace-${GITHUB_REF_NAME}.tar.gz" marketplace
      - name: Publish release packages and marketplace catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/plugin/checksums.json
            dist/marketplace/.agents/plugins/marketplace.json
            "dist/forgemind-plugin-${GITHUB_REF_NAME}.tar.gz"
            "dist/forgemind-marketplace-${GITHUB_REF_NAME}.tar.gz"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "ForgeMind $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --title "ForgeMind $GITHUB_REF_NAME"
          fi
